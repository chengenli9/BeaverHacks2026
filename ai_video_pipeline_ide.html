*{box-sizing:border-box;margin:0;padding:0;}
.mono{font-family:var(--font-mono);}
.app{display:grid;grid-template-rows:1fr auto;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden;background:var(--color-background-primary);min-height:580px;}
.workspace{display:grid;grid-template-columns:168px 1fr 168px;min-height:0;}
.panel{background:var(--color-background-secondary);border-right:0.5px solid var(--color-border-tertiary);display:flex;flex-direction:column;overflow:hidden;}
.panel.right{border-right:none;border-left:0.5px solid var(--color-border-tertiary);}
.panel-head{padding:8px 10px 6px;border-bottom:0.5px solid var(--color-border-tertiary);display:flex;align-items:center;gap:6px;flex-shrink:0;}
.panel-head-label{font-size:10px;font-weight:500;letter-spacing:0.06em;text-transform:uppercase;color:var(--color-text-secondary);}
.tree{padding:6px 0;overflow-y:auto;flex:1;}
.tree-node{display:flex;align-items:center;gap:5px;padding:3px 8px;font-size:11px;font-family:var(--font-mono);color:var(--color-text-secondary);cursor:default;user-select:none;line-height:1.4;}
.tree-node.dir{color:var(--color-text-primary);font-weight:500;}
.tree-node.new{animation:fadeIn 0.4s ease;}
.tree-node.active-file{color:#BA7517;background:#FAEEDA44;}
.tree-node.done-file{color:#0F6E56;}
.tree-indent{padding-left:14px;}
.tree-icon{font-size:10px;flex-shrink:0;}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.main{display:flex;flex-direction:column;padding:18px 20px;gap:14px;overflow-y:auto;}
.screen-title{font-size:13px;font-weight:500;color:var(--color-text-primary);}
.screen-sub{font-size:11px;color:var(--color-text-secondary);font-family:var(--font-mono);}
.dropzone{border:1.5px dashed var(--color-border-secondary);border-radius:var(--border-radius-md);padding:28px 16px;text-align:center;cursor:pointer;transition:border-color 0.15s,background 0.15s;}
.dropzone:hover{border-color:#BA7517;background:#FAEEDA18;}
.dz-icon{font-size:22px;margin-bottom:8px;}
.dz-main{font-size:13px;font-weight:500;color:var(--color-text-primary);margin-bottom:3px;}
.dz-sub{font-size:11px;color:var(--color-text-secondary);}
.btn{padding:6px 14px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:transparent;color:var(--color-text-primary);font-size:12px;cursor:pointer;font-family:var(--font-sans);transition:background 0.1s;}
.btn:hover{background:var(--color-background-secondary);}
.btn-primary{background:#BA7517;color:#fff;border-color:#BA7517;font-weight:500;}
.btn-primary:hover{background:#854F0B;border-color:#854F0B;}
.btn-sm-ok{background:transparent;border:0.5px solid #1D9E75;color:#0F6E56;font-size:11px;padding:4px 10px;border-radius:var(--border-radius-md);cursor:pointer;font-family:var(--font-sans);}
.btn-sm-ok:hover{background:#E1F5EE;}
.btn-sm-no{background:transparent;border:0.5px solid #A32D2D;color:#A32D2D;font-size:11px;padding:4px 10px;border-radius:var(--border-radius-md);cursor:pointer;font-family:var(--font-sans);}
.btn-sm-no:hover{background:#FCEBEB;}
.btn-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.prog-track{background:var(--color-background-secondary);border-radius:4px;height:5px;overflow:hidden;}
.prog-fill{height:100%;border-radius:4px;background:#BA7517;transition:width 0.5s;}
.prog-fill.teal{background:#1D9E75;}
.proc-list{display:flex;flex-direction:column;gap:6px;}
.proc-row{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--color-background-secondary);border-radius:var(--border-radius-md);}
.proc-status{font-size:10px;font-weight:500;min-width:42px;font-family:var(--font-mono);}
.st-done{color:#0F6E56;}.st-run{color:#BA7517;}.st-wait{color:var(--color-text-tertiary);}
.proc-name{font-size:11px;color:var(--color-text-primary);flex:1;}
.proc-detail{font-size:10px;color:var(--color-text-secondary);font-family:var(--font-mono);}
.code-block{background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:10px 12px;font-family:var(--font-mono);font-size:10px;color:var(--color-text-secondary);line-height:1.6;max-height:130px;overflow-y:auto;}

.player-mock{background:#0d0d0d;border-radius:var(--border-radius-md);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px;min-height:120px;}

.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.stat{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:8px 10px;}
.stat-lbl{font-size:10px;color:var(--color-text-secondary);margin-bottom:3px;}

.patch-card.app{border-color:#1D9E75;background:#E1F5EE18;}

.ph{display:flex;align-items:center;gap:7px;}
.pbadge{font-size:10px;font-weight:500;padding:2px 7px;border-radius:20px;}
.pb-t{background:#FAEEDA;color:#854F0B;}.pb-n{background:#E1F5EE;color:#085041;}.pb-c{background:#FAECE7;color:#993C1D;}
.patch-desc{font-size:11px;color:var(--color-text-secondary);line-height:1.5;}
.patch-btns{display:flex;gap:6px;}
.tag-a{display:inline-flex;align-items:center;font-size:10px;font-weight:500;background:#FAEEDA;color:#854F0B;padding:2px 8px;border-radius:20px;}
.tag-t{display:inline-flex;align-items:center;font-size:10px;font-weight:500;background:#E1F5EE;color:#085041;padding:2px 8px;border-radius:20px;}
.spinner{display:inline-block;width:10px;height:10px;border:1.5px solid #FAC775;border-top-color:#BA7517;border-radius:50%;animation:spin 0.7s linear infinite;}

.final-name{font-size:15px;font-weight:500;color:var(--color-text-primary);margin-bottom:3px;}
.final-meta{font-size:10px;color:var(--color-text-secondary);font-family:var(--font-mono);margin-bottom:14px;}

/* BOTTOM PROGRESS */
.bottom-progress{border-top:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary);padding:10px 12px;display:flex;flex-direction:column;gap:6px;flex-shrink:0;}
.progress-steps{display:flex;align-items:center;gap:0;}
.ps-group{display:flex;align-items:center;gap:0;}

.ps-dot{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:500;transition:transform 0.15s;border:1.5px solid var(--color-border-tertiary);background:var(--color-background-primary);color:var(--color-text-tertiary);}

.phase-seg{flex:1;text-align:center;text-transform:uppercase;}

function renderTree(id, nodes) {
  const el = document.getElementById(id);
  if (!el) return;
  el.innerHTML = '';
  (nodes||[]).forEach(n => {
    const row = document.createElement('div');
    row.className = 'tree-node ' + (n.t==='d'?'dir ':'') + (n.c||'');
    row.style.paddingLeft = (8 + n.i*12) + 'px';
    const ic = document.createElement('span');
    ic.className = 'tree-icon';
    ic.textContent = n.t==='d' ? '▾' : (n.ic||'·');
    const lbl = document.createElement('span');
    lbl.textContent = n.l;
    row.appendChild(ic); row.appendChild(lbl);
    el.appendChild(row);
  });
}

function renderProgressBar() {
  const container = document.getElementById('progress-steps');
  if (!container) return;
  container.innerHTML = '';
  STEPS.forEach((s, i) => {
    if (i > 0) {
      const conn = document.createElement('div');
      conn.className = 'ps-connector' + (i <= cur ? ' done' : '');
      conn.style.flex = '1';
      container.appendChild(conn);
    }
    const step = document.createElement('div');
    step.className = 'ps-step';
    step.title = s.label;
    const state = i < cur ? 'done' : i === cur ? 'active' : '';
    const dot = document.createElement('div');
    dot.className = 'ps-dot ' + state;
    dot.textContent = state === 'done' ? '✓' : s.n;
    if (state !== '' || i === 0) {
      step.style.cursor = 'pointer';
      step.onclick = () => { if (i <= cur) { cur = i; render(); } };
    }
    step.appendChild(dot);
    container.appendChild(step);
  });
  const curStep = STEPS[cur];
  const cl = document.getElementById('step-cur-label');
  const sf = document.getElementById('step-fraction');
  if (cl) cl.textContent = 'Step ' + curStep.n + ' — ' + curStep.label;
  if (sf) sf.textContent = (cur+1) + ' / 15';
}

function animBar(id, from, to, ms, cb) {
  const el = document.getElementById(id);
  if (!el) return;
  const s = Date.now();
  const t = () => { const p=Math.min((Date.now()-s)/ms,1); el.style.width=(from+(to-from)*p)+'%'; if(p<1)requestAnimationFrame(t); else cb&&cb(); };
  requestAnimationFrame(t);
}

};

window.appPatch = function(id) {
  patches[id]=true;
  const c=document.getElementById(id);
  if(c){c.classList.add('app');c.classList.remove('rej');c.querySelectorAll('button').forEach(b=>b.disabled=true);}
  updatePatchCount();
};
window.rejPatch = function(id) {
  patches[id]=false;
  const c=document.getElementById(id);
  if(c){c.classList.add('rej');c.classList.remove('app');c.querySelectorAll('button').forEach(b=>b.disabled=true);}
  updatePatchCount();
};
function updatePatchCount() {
  const n=Object.values(patches).filter(v=>v===true).length;
  const el=document.getElementById('app-count');const btn=document.getElementById('apply-btn');
  if(el)el.textContent=n+' of 3 approved';
  if(btn){btn.disabled=n===0;btn.style.opacity=n>0?'1':'0.4';}
}
